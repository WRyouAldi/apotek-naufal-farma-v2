name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

concurrency:
  group: apotek-naufal-farma-main
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      APK_SIGNING_KEYSTORE_BASE64: ${{ secrets.APK_SIGNING_KEYSTORE_BASE64 }}
      APK_SIGNING_STORE_PASSWORD: ${{ secrets.APK_SIGNING_STORE_PASSWORD }}
      APK_SIGNING_KEY_ALIAS: ${{ secrets.APK_SIGNING_KEY_ALIAS }}
      APK_SIGNING_KEY_PASSWORD: ${{ secrets.APK_SIGNING_KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11'

      - name: Rebuild exact Harga Beli payload
        run: cat tools/harga_beli_parts/[0-9][0-9] > tools/harga_beli.b64

      - name: Prepare APK HTML
        run: python3 tools/prepare_apk_v3.py

      - name: Verify Charcoal Silver theme source and APK preparation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          source=Path('docs/index.html').read_text(encoding='utf-8')
          generated=Path('app/src/main/assets/index.html').read_text(encoding='utf-8')
          checks={
            'Charcoal Silver hard override':'HARD OVERRIDE v2: prevent legacy inline/light cards',
            'Dark Pearl selector':'html[data-dshe-theme="dark"]',
            'dark card surface':'--dshe-charcoal-card:#292d33',
            'card text contrast':'--dshe-charcoal-text:#f2f4f7',
            'QR canvas preservation':'Preserve white QR image canvas for scanning',
          }
          missing=[name for name,needle in checks.items() if needle not in source]
          if missing:
            raise SystemExit('Canonical UI theme verification failed; missing: '+', '.join(missing))
          if '<html' not in generated.lower() or '</html>' not in generated.lower():
            raise SystemExit('Prepared APK HTML is incomplete')
          print('Canonical Charcoal Silver theme verified and APK HTML document is complete')
          PY

      - name: Inject robust CSV importer
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/src/main/assets/index.html')
          s=p.read_text(encoding='utf-8')
          js=Path('tools/csv_import_v2.js').read_text(encoding='utf-8')
          tag='<script id="csvImportV2">\n'+js+'\n</script>\n'
          pos=s.lower().rfind('</body></html>')
          if pos<0:
              raise SystemExit('index.html closing tag not found')
          s=s[:pos]+tag+s[pos:]
          p.write_text(s,encoding='utf-8')
          print('Injected CSV Import V2')
          PY

      - name: Inject GitHub cloud CSV sync
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/src/main/assets/index.html')
          s=p.read_text(encoding='utf-8')
          js=Path('tools/github_cloud_sync.js').read_text(encoding='utf-8')
          tag='<script id="githubCloudSync">\n'+js+'\n</script>\n'
          pos=s.lower().rfind('</body></html>')
          if pos<0:
              raise SystemExit('index.html closing tag not found')
          s=s[:pos]+tag+s[pos:]
          p.write_text(s,encoding='utf-8')
          print('Injected GitHub Cloud Sync')
          PY

      - name: Apply robust A4 PDF renderer
        run: python3 tools/patch_pdf_a4.py

      - name: Run V2 static regression checks
        run: python3 tools/validate_v2.py
        
      - name: Check JavaScript syntax
        run: |
          for file in tools/*.js; do node --check "$file"; done

      - name: Validate generated database seed
        run: |
          python3 - <<'PY'
          import json
          p='app/src/main/assets/products_seed.json'
          rows=json.load(open(p,encoding='utf-8'))
          costs=sum(1 for x in rows if int(x.get('cost',0) or 0)>0)
          assert len(rows)==4348, f'Expected 4348 products, got {len(rows)}'
          assert costs>=4000, f'Expected Harga Beli for >=4000 products, got {costs}'
          print(f'Database seed OK: {len(rows)} products; Harga Beli: {costs}')
          PY

      - name: Configure persistent APK signing
        if: ${{ env.APK_SIGNING_KEYSTORE_BASE64 != '' }}
        run: |
          echo "$APK_SIGNING_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/apotek-naufal-release.keystore"
          test -s "$RUNNER_TEMP/apotek-naufal-release.keystore"

      - name: Build APK
        env:
          SIGNING_STORE_FILE: ${{ env.APK_SIGNING_KEYSTORE_BASE64 != '' && format('{0}/apotek-naufal-release.keystore', runner.temp) || '' }}
          SIGNING_STORE_PASSWORD: ${{ env.APK_SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ env.APK_SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ env.APK_SIGNING_KEY_PASSWORD }}
        run: |
          if [ -n "$SIGNING_STORE_FILE" ]; then
            echo "Building signed release APK"
            gradle :app:assembleRelease --no-daemon
            cp app/build/outputs/apk/release/app-release.apk "app/build/outputs/apk/release/Apotek-Naufal-Farma-V17-Build-${GITHUB_RUN_NUMBER}.apk"
            echo "APK_VARIANT=release" >> "$GITHUB_ENV"
            echo "APK_PATH=app/build/outputs/apk/release/Apotek-Naufal-Farma-V17-Build-${GITHUB_RUN_NUMBER}.apk" >> "$GITHUB_ENV"
          else
            echo "Persistent signing key not configured; building debug APK"
            gradle :app:assembleDebug --no-daemon
            cp app/build/outputs/apk/debug/app-debug.apk "app/build/outputs/apk/debug/Apotek-Naufal-Farma-V17-Build-${GITHUB_RUN_NUMBER}.apk"
            echo "APK_VARIANT=debug" >> "$GITHUB_ENV"
            echo "APK_PATH=app/build/outputs/apk/debug/Apotek-Naufal-Farma-V17-Build-${GITHUB_RUN_NUMBER}.apk" >> "$GITHUB_ENV"
          fi

      - name: Show app version
        run: |
          echo "Build number: ${GITHUB_RUN_NUMBER}"
          echo "APK variant: ${APK_VARIANT}"
          echo "Version: 1.4.${GITHUB_RUN_NUMBER}"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Apotek-Naufal-Farma-V17-Build-${{ github.run_number }}
          path: ${{ env.APK_PATH }}
          if-no-files-found: error
          retention-days: 30
