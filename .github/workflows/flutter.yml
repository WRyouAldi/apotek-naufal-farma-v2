name: Flutter POS validation

on:
  push:
    branches: [p2.3.2-flutter-migration]
  pull_request:
    branches: [main]

jobs:
  android-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android platform scaffold
        run: flutter create --platforms=android --project-name=dshe_farma_pos .
      - name: Remove generated placeholder test
        run: rm -f test/widget_test.dart
      - name: Resolve dependencies
        run: flutter pub get
      - name: Analyze Dart
        run: flutter analyze
      - name: Run tests
        run: flutter test
      - name: Build release APK
        run: flutter build apk --release
      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: dshe-farma-pos-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
