name: Flutter foundation checks

on:
  push:
    paths:
      - 'flutter_app/**'
      - '.github/workflows/flutter-foundation.yml'
  pull_request:
    paths:
      - 'flutter_app/**'
      - '.github/workflows/flutter-foundation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter_app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter create --platforms=android --project-name dshe_farma_pos --org id.dshefarma --no-pub .
      - run: flutter pub get
      - run: dart format lib test
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: Dshe-Farma-Flutter-Foundation-debug
          path: flutter_app/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
